services:
  - type: web
    name: cles-savoir-etre
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cles-savoir-etre-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: RETENTION_MONTHS
        value: "24"
      - key: ANTHROPIC_API_KEY
        sync: false

databases:
  - name: cles-savoir-etre-db
    region: frankfurt
    plan: basic-256mb
    databaseName: savoir_etre
    user: savoir_etre
